    <style>

      .custom-table tbody tr:hover { background: hsl(var(--muted) / 0.1); }

      /* Stats box sections */
      .stats-section { padding: 12px 16px; border-bottom: 1px solid hsl(var(--border) / 0.4); }

      .stats-section-label {
        font-size: 10px; font-weight: 600; letter-spacing: 0.08em;

      /* ── ADS Spotlight Card ── */
      .ads-featured-wrap { padding: 0 16px 16px; width: 100%; box-sizing: border-box; flex: 0 0 100%; }
      .ads-label {

      /* Spotlight card wrapper */
      .ads-spotlight-card {
        background: linear-gradient(135deg, rgba(245,158,11,0.08) 0%, rgba(10,12,18,0.95) 60%);

      /* Top bar */

      /* Token info: logo + name + price */
      .ads-spotlight-token { display: flex; align-items: center; gap: 11px; flex: 0 0 auto; }
      .ads-spotlight-logo {
        width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex-shrink: 0;

      /* Divider */

      /* Stats */

      .ads-sstat-val { font-size: 13px; font-weight: 600; color: #fff; }
      /* Right side: socials + buy button */
      .ads-spotlight-right { display: flex; flex-direction: column; gap: 8px; margin-left: auto; align-items: flex-end; justify-content: center; }
      .ads-socials-row { display: flex; gap: 6px; align-items: center; }
      .ads-social-link {
        display: inline-flex; align-items: center; justify-content: center;

      .ads-buy-btn {
        display: inline-flex; align-items: center; gap: 7px;

      .ads-buy-btn:hover { opacity: 0.88; box-shadow: 0 4px 18px rgba(9,176,173,0.45); }
      .ads-buy-btn svg { flex-shrink: 0; }

      /* ── ADS Manager (admin page) ── */
      #sui-ads-manager {
        max-width: 680px; margin: 16px auto 0; padding: 0 16px;

      .ads-mgr-card {
        background: hsl(var(--card)); border: 1px solid rgba(245,158,11,0.3);
        border-radius: 10px; overflow: hidden;
      }
      .ads-mgr-hdr {
        padding: 11px 16px; background: rgba(245,158,11,0.07);

      }
      .ads-mgr-title { font-weight: 700; font-size: 14px; color: #f59e0b; }
      .ads-mgr-body { padding: 16px; }
      .ads-mgr-lbl { font-size: 11px; color: hsl(var(--muted-foreground)); margin-bottom: 5px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; }
      .ads-mgr-input {
        width: 100%; background: hsl(var(--muted)/0.3); border: 1px solid hsl(var(--border)/0.5);
        border-radius: 6px; padding: 8px 10px; font-size: 12px; color: hsl(var(--foreground));
        outline: none; box-sizing: border-box; font-family: monospace;
      }
      .ads-mgr-input:focus { border-color: rgba(245,158,11,0.5); }
      .ads-mgr-row { margin-bottom: 12px; }
      .ads-mgr-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
      .ads-mgr-btn {
        font-size: 13px; font-weight: 600; padding: 7px 18px; border-radius: 6px;
        border: none; cursor: pointer; transition: opacity 0.2s;
      }
      .ads-mgr-btn:hover { opacity: 0.82; }
      .ads-mgr-btn.set { background: #f59e0b; color: #000; }
      .ads-mgr-btn.clr { background: rgba(239,68,68,0.14); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); }
      .ads-current-box {
        display: flex; align-items: flex-start; gap: 10px;
        background: rgba(245,158,11,0.07); border-radius: 6px; padding: 10px 12px; margin-bottom: 14px;
      }
      .ads-current-lbl { font-size: 11px; color: #f59e0b; font-weight: 600; white-space: nowrap; margin-top: 1px; }
      .ads-current-addr { font-family: monospace; font-size: 11px; color: hsl(var(--foreground)); word-break: break-all; }
      .ads-mgr-msg { font-size: 12px; margin-top: 8px; }
      .ads-mgr-msg.ok { color: #22c55e; } .ads-mgr-msg.err { color: #ef4444; }

      /* ── ADS button on pair pages ── */
      .ads-pair-btn {
        display: inline-flex; align-items: center; gap: 5px;
        font-size: 12px; font-weight: 600; padding: 5px 11px; border-radius: 6px;
        border: 1px solid rgba(245,158,11,0.38); background: rgba(245,158,11,0.09);
        color: #f59e0b; cursor: pointer; transition: background 0.2s; vertical-align: middle;
      }
      .ads-pair-btn:hover { background: rgba(245,158,11,0.2); }
      .ads-pair-btn.active { background: rgba(245,158,11,0.22); border-color: #f59e0b; }
      /* ── Admin contact link on pair pages ── */
      .admin-contact-link {
        display: inline-flex; align-items: center; gap: 5px;
        font-size: 12px; font-weight: 600; padding: 5px 11px; border-radius: 6px;
        border: 1px solid rgba(41,182,246,0.38); background: rgba(41,182,246,0.09);
        color: #29b6f6; text-decoration: none; transition: background 0.2s; vertical-align: middle;
        white-space: nowrap;
      }
      .admin-contact-link:hover { background: rgba(41,182,246,0.2); border-color: rgba(41,182,246,0.6); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
    (function () {
      var injectedPair = null;
      var injectedChart = null;
      var debounceTimer = null;
      var chartTimer = null;

      function findTimeframeBar() {
        var buttons = document.querySelectorAll('button');
        for (var i = 0; i < buttons.length; i++) {
          if (buttons[i].textContent.trim() === '1m') return buttons[i].parentElement;
        }
        return null;
      }

      function findChartContainer() {
        var canvas = document.querySelector('canvas');
        if (!canvas) return null;
        // Walk up to find a container tall enough to be the chart area
        var el = canvas.parentElement;
        while (el && el !== document.body) {
          if (el.offsetHeight > 200 && el.offsetWidth > 200) return el;
          el = el.parentElement;
        }
        return canvas.parentElement;
      }

      function injectDexChart(pairAddress) {
        if (document.getElementById('dex-chart-frame')) return true;
        var container = findChartContainer();
        if (!container) return false;
        if (container.offsetHeight < 100) return false;
        // Overlay on top of the chart container — do NOT remove React's nodes
        var pos = window.getComputedStyle(container).position;
        if (pos === 'static') container.style.position = 'relative';
        var overlay = document.createElement('div');
        overlay.id = 'dex-chart-frame';
        overlay.style.cssText = 'position:absolute;inset:0;z-index:9999;background:#0d1117;pointer-events:auto;';
        var iframe = document.createElement('iframe');
        iframe.src = 'https://dexscreener.com/sui/' + pairAddress + '?embed=1&theme=dark&trades=0&info=0';
        iframe.style.cssText = 'width:100%;height:100%;border:none;display:block;min-height:420px;';
        iframe.allow = 'clipboard-write';
        overlay.appendChild(iframe);
        container.appendChild(overlay);
        injectedChart = pairAddress;
        return true;
      }

      function tryInjectChart(pairAddress, attempts) {
        attempts = attempts || 0;
        if (injectedChart === pairAddress && document.getElementById('dex-chart-frame')) return;
        if (injectDexChart(pairAddress)) return;
        if (attempts < 50) {
          clearTimeout(chartTimer);
          chartTimer = setTimeout(function () { tryInjectChart(pairAddress, attempts + 1); }, 200);
        }
      }

      function fmtUSD(v) {
        if (v >= 1e9) return '$' + (v / 1e9).toFixed(2) + 'B';
        if (v >= 1e6) return '$' + (v / 1e6).toFixed(2) + 'M';
        if (v >= 1e3) return '$' + (v / 1e3).toFixed(1) + 'K';
        return '$' + v.toFixed(2);
      }
      function icon(path, color) {
        return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="' + (color || 'hsl(var(--muted-foreground))') + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + path + '</svg>';
      }

      async function getPairData(pairAddress) {
        var results = await Promise.allSettled([
          fetch('/api/tokens/' + pairAddress).then(function(r){ return r.json(); }),
          fetch('/api/tokens/' + pairAddress + '/info').then(function(r){ return r.json(); })
        ]);
        var token = results[0].status === 'fulfilled' ? results[0].value : {};
        var info = results[1].status === 'fulfilled' ? results[1].value : {};
        return {
          txns: token.txns || {},
          volume: token.volume || {},
          totalHolders: info.totalHolders || 0,
          totalMakers: info.totalMakers || 0,
          top10Pct: info.top10Pct || 0,
          deployerPct: info.deployerPct || 0
        };
      }

      function buildStatsBox(data) {
        var holders = Number(data.totalHolders) || 0;
        var top10 = Math.min(parseFloat(data.top10Pct) || 0, 100);
        var others = Math.max(0, parseFloat((100 - top10).toFixed(2)));

        var div = document.createElement('div');
        div.id = 'sui-stats-box';
        div.className = 'custom-card';

        div.innerHTML =
          '<div class="custom-card-header">' +
            icon('<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>', 'hsl(var(--primary))') +
            '<span class="custom-card-title" style="font-size:13px;">Holders</span>' +
          '</div>' +
          (top10 > 0 ? (
            '<div class="stats-section">' +
              '<div class="stats-section-label">' +
                icon('<path d="M12 20v-6M6 20V10M18 20V4"/>') +
                'Top 10 Holders' +
              '</div>' +
              '<div class="bar-row">' +
                '<div class="bar-meta"><span>Top 10 Wallets</span><span style="font-weight:600;color:hsl(var(--primary))">' + top10.toFixed(2) + '%</span></div>' +
                '<div class="bar-track"><div class="bar-fill" style="width:' + top10 + '%;background:#6366f1;"></div></div>' +
              '</div>' +
              '<div class="bar-row">' +
                '<div class="bar-meta"><span>Others</span><span>' + others + '%</span></div>' +
                '<div class="bar-track"><div class="bar-fill" style="width:' + others + '%;background:hsl(var(--muted-foreground));opacity:0.4;"></div></div>' +
              '</div>' +
            '</div>'
          ) : '');

        return div;
      }

      function findTxCard() {
        var tbodies = document.querySelectorAll('tbody');
        for (var i = 0; i < tbodies.length; i++) {
          var cls = tbodies[i].className || '';
          if (cls.indexOf('divide-y') !== -1 || cls.indexOf('divide-border') !== -1) {
            var card = tbodies[i].closest('[class*="rounded"]') || tbodies[i].closest('[class*="border"]') || tbodies[i].parentElement && tbodies[i].parentElement.parentElement;
            if (card) return card;
          }
        }
        var all = document.querySelectorAll('[class]');
        for (var j = 0; j < all.length; j++) {
          if (all[j].childNodes.length === 1 && all[j].textContent.trim() === 'Live Transactions') {
            var p = all[j].closest('[class*="rounded"]') || all[j].closest('[class*="border"]');
            if (p) return p;
          }
        }
        return null;
      }

      function findSidebarContainer() {
        var els = document.querySelectorAll('*');
        for (var i = 0; i < els.length; i++) {
          var el = els[i];
          if (el.children.length >= 2 &&
              el.textContent.indexOf('Token Stats') !== -1 &&
              el.textContent.indexOf('Pool Info') !== -1 &&
              el.tagName !== 'BODY') {
            if (el.offsetWidth < 350 && el.offsetWidth > 50) return el;
            if (window.getComputedStyle(el).flexDirection === 'column' && el.offsetWidth < 450) return el;
          }
        }
        return null;
      }

      async function injectSections(pairAddress) {
        if (injectedPair === pairAddress) return;

        var txCard = findTxCard();
        if (!txCard) return;

        injectedPair = pairAddress;

        var el = document.getElementById('sui-stats-box');
        if (el) el.remove();

        var txParent = txCard.parentNode;
        if (!txParent) return;

        var sidebar = findSidebarContainer();
        var statsPlaceholder = document.createElement('div');
        statsPlaceholder.id = 'sui-stats-box';
        statsPlaceholder.className = 'custom-card';
        statsPlaceholder.innerHTML = '<div style="padding:14px 16px;font-size:13px;color:hsl(var(--muted-foreground))">Loading stats…</div>';
        if (sidebar) {
          sidebar.appendChild(statsPlaceholder);
        } else {
          txParent.appendChild(statsPlaceholder);
        }

        var result = await getPairData(pairAddress);

        if (injectedPair !== pairAddress) return;

        var statsEl = document.getElementById('sui-stats-box');
        if (statsEl) {
          statsEl.replaceWith(buildStatsBox(result));
        }
      }

      // ── ADS System ───────────────────────────────────────────────────────────
      var adsData = null;
      var adsBannerInjected = false;
      var adsManagerInjected = false;
      var adsPairBtnInjected = null;

      function fetchAdsData(cb) {
        fetch('/api/ads').then(function(r){ return r.json(); }).then(function(d){
          adsData = d;
          if (cb) cb(d);
        }).catch(function(){ if (cb) cb(null); });
      }

      function setAdsTokenAPI(address, password, cb) {
        fetch('/api/admin/ads', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-admin-password': password },
          body: JSON.stringify({ tokenAddress: address })
        }).then(function(r){ return r.json(); }).then(function(d){
          if (cb) cb(d.ok ? null : (d.error || 'Failed'), d);
        }).catch(function(e){ if (cb) cb(e.message); });
      }

      function clearAdsTokenAPI(password, cb) {
        fetch('/api/admin/ads', {
          method: 'DELETE',
          headers: { 'x-admin-password': password }
        }).then(function(r){ return r.json(); }).then(function(d){
          if (cb) cb(d.ok ? null : (d.error || 'Failed'));
        }).catch(function(e){ if (cb) cb(e.message); });
      }

      function socialIcon(platform) {
        var p = (platform || '').toLowerCase();

      function findStatsBox() {
        var root2 = document.getElementById('root');
        if (!root2) return null;
        // Find the SMALLEST element inside #root that contains both "24h Volume" and "Liquidity"
        var best = null;
        var bestLen = Infinity;
        var all = root2.querySelectorAll('*');
        for (var i = 0; i < all.length; i++) {
          var el = all[i];
          if (!el.offsetHeight) continue;
          var txt = el.textContent || '';
          if (txt.indexOf('24h Volume') !== -1 && txt.indexOf('Liquidity') !== -1 && txt.length < bestLen) {
            bestLen = txt.length;
            best = el;
          }
        }
        return best;
      }

      function findTrendingSection() {
        // Find the exact "Trending SUI Pairs" heading element (not nav links)
        var root2 = document.getElementById('root');
        if (!root2) return null;
        var all = root2.querySelectorAll('*');
        var best = null;
        var bestLen = Infinity;
        for (var i = 0; i < all.length; i++) {
          var el = all[i];
          if (!el.offsetHeight) continue;
          // Must contain the exact heading phrase — not nav links
          var direct = (el.childNodes.length === 1 && el.childNodes[0].nodeType === 3)
            ? el.textContent.trim()
            : '';
          var txt = el.textContent || '';
          // Match the specific heading text, and ensure we're not inside <nav> or <a>
          if (
            txt.indexOf('Trending SUI Pairs') !== -1 &&
            txt.length < bestLen &&
            el.tagName !== 'A' &&
            !el.closest('nav') &&
            !el.closest('header')
          ) {
            bestLen = txt.length;
            best = el;
          }
        }
        return best;

      function findSectionAncestor(el) {
        // Walk up the DOM from the heading element to find the section-level container.
        // We want to find the ancestor whose SIBLING (or close relative) includes the pairs table,
        // so we insert the banner before the whole section — not inside the heading's flex row.
        var cur = el;
        while (cur && cur.parentNode && cur.parentNode.nodeType === 1) {
          var parent = cur.parentNode;
          if (parent.id === 'root' || parent.tagName === 'BODY' || parent.tagName === 'HTML') break;
          // Check if any sibling of cur (within parent) contains a tbody (the pairs table)
          var siblings = Array.prototype.slice.call(parent.children);
          var siblingHasTable = siblings.some(function(sib) {
            return sib !== cur && (sib.tagName === 'TABLE' || sib.tagName === 'TBODY' || sib.querySelector('tbody'));
          });
          if (siblingHasTable) {
            // cur is at the right level — its sibling is the table, so insert before cur
            return cur;
          }
          cur = parent;
        }
        return el;
      }

      function injectAdsBanner() {
        if (!adsData || !adsData.tokenAddress) {
          var old = document.getElementById('ads-featured-wrap');

          return;

        if (adsBannerInjected && document.getElementById('ads-featured-wrap')) return;
        var existing = document.getElementById('ads-featured-wrap');
        if (existing) existing.remove();
        var banner = buildAdsBanner(adsData.pair || null);

        var isPair = !!getPairFromURL();

        if (!isPair) {
          // On home/trending page only: inject above the whole "Trending SUI Pairs" section
          var trendingEl = findTrendingSection();
          if (trendingEl) {
            // Walk up to the section-level ancestor so we insert before the heading+table block,
            // not inside the heading's own flex row (which would hide the title).
            var insertTarget = findSectionAncestor(trendingEl);
            var insertParent = insertTarget.parentNode;
            if (insertParent && insertParent.nodeType === 1) {
              insertParent.insertBefore(banner, insertTarget);
              adsBannerInjected = true;
              return;
            }
          }
        }

        // Fallback: only on home page, insert after stats box
        if (isPair) return;
        var statsBox = findStatsBox();
        if (!statsBox) return;
        var parent = statsBox.parentNode;
        if (parent && parent.nodeType === 1 && parent !== document.documentElement && parent !== document.head) {
          parent.insertBefore(banner, statsBox.nextSibling);
          adsBannerInjected = true;
        }
      }

          }

          // chart injection
          var frameExists = !!document.getElementById('dex-chart-frame');
          if (pair !== injectedChart || !frameExists) {
            if (!frameExists) injectedChart = null;
            var old2 = document.getElementById('dex-chart-frame');
            if (old2) { old2.remove(); injectedChart = null; }
            tryInjectChart(pair, 0);
          }

          // stats box injection
          var hasStats = !!document.getElementById('sui-stats-box');
          if (pair !== injectedPair || !hasStats) {
            if (pair !== injectedPair) injectedPair = null;
            injectSections(pair);
          }

          // ADS button on pair pages
          injectAdsPairButton(pair);

          // Admin contact (Advertise) link on pair pages
          injectAdminContactLink();
        }, 150);
      }

      var root = document.getElementById('root') || document.body;
      new MutationObserver(function (muts) {
        for (var i = 0; i < muts.length; i++) {
          if (muts[i].addedNodes.length > 0) { check(); break; }
        }
      }).observe(root, { childList: true, subtree: true });

      var origPush = history.pushState.bind(history);
      history.pushState = function () {
        origPush.apply(history, arguments);
        injectedPair = null;
        adsBannerInjected = false;
        adsManagerInjected = false;
        adsPairBtnInjected = null;
        adminContactInjected = false;
        check();
      };
      window.addEventListener('popstate', function () {
        injectedPair = null;
        adsBannerInjected = false;
        adsManagerInjected = false;
        adsPairBtnInjected = null;
        adminContactInjected = false;
        check();
      });

      // Bootstrap ADS data then start
      fetchAdsData(function() { setTimeout(check, 1000); });
    })();
    </script>
  </body>
</html>
